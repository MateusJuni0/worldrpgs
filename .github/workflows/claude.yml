name: claude

# Escreve @claude num comentário de issue ou de PR e ele responde.
# Serve para o Rico perguntar coisas sem ter de esperar pelo Mateus.
#
# Sem prompt aqui de propósito: o contexto vem do CLAUDE.md do repositório.
# Regra nova escreve-se lá, não neste ficheiro.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  responder:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model sonnet
            --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git diff:*),Bash(node tools/check-coerencia.mjs:*)"
